<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0c10;
        --ink: #ffffff;
        --accent: #7c3aed;
        --font-display: ui-sans-serif, system-ui, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        position: relative;
      }
      #title {
        color: var(--ink);
        font-size: 120px;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: center;
        line-height: 1.15;
      }
      #title .word {
        position: relative;
        display: inline-block;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 60% at 50% 30%, #1a1a2e 0%, var(--ground) 60%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <audio id="bgm" src="assets/bgm/track.wav" data-start="0" data-duration="10"></audio>
      <div id="bg"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <span class="word">Intro</span>
      </h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.2, ease: "power4.out" }, 0);
      tl.to("#title .word", { scale: 1.06, duration: 0.4, ease: "back.out(1.7)" }, 1.2);
      tl.to("#title", { opacity: 0, duration: 0.8, ease: "power2.in" }, 8.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
